# dsh-companion 配置示例（16 个配置键）
#
# 用法：
#   1. 复制本文件为 config.yml（或把需要的键并入你的 profile patch）。
#   2. 首次安装先跑一次自检：
#        node scripts/calibrate/run.mjs
#      它会写出 .data/config.suggested.yml；按建议值修改 config.yml，而不是
#      直接让建议文件生效。
#   3. 内存/上下文差异较大时，以自检建议为准；下面括号里是默认值与单位。
#
# 注意：token 四档必须满足
#   0 < retainTokens < compactAtTokens < workingMemoryTokens < compactHardTokens
# 未知键只会记 warning，不会阻断启动。

# 工作记忆装配上限（token，默认 32000；建议 = min(32000, contextWindow×0.25)）
workingMemoryTokens: 32000

# 连续两轮超过该值触发巩固（token，默认 24000；建议 = round(0.75×workingMemoryTokens)）
compactAtTokens: 24000

# 安全阀：装配不得越过该值（token，默认 40000；建议 = min(1.25×working, contextWindow×0.6)）
compactHardTokens: 40000

# 距最后一条人类消息多久后允许「空闲巩固」（毫秒，默认 1800000 = 30 分钟）
idleMs: 1800000

# 压缩时保留的最近对话尾部（token，默认 6144；MVP 固定值）
retainTokens: 6144

# 线程空闲多少天后冻结（天，默认 14，>= 1）
threadIdleDays: 14

# 同时活跃的线程上限（个，默认 6，>= 1）
threadMaxActive: 6

# 每日主动消息上限（条，默认 3，>= 0；0 表示关闭主动消息）
proactiveDailyCap: 3

# 安静时段开始（HH:MM，默认 23:00，按 timezone 解释）
quietStart: "23:00"

# 安静时段结束（HH:MM，默认 08:00，按 timezone 解释）
quietEnd: "08:00"

# 墙上时间所用 IANA 时区（默认 Asia/Shanghai；影响安静时段、每日任务、
# 日界线与备份文件名，不读取进程 TZ 环境变量）
timezone: "Asia/Shanghai"

# 遗忘冷静期：标记忘掉后多少天物理删除（天，默认 7，范围 1–30）
purgeAfterDays: 7

# SQLite 数据库路径（默认 ./.data/companion.db；必须是可写目录下的非空路径）
dbPath: "./.data/companion.db"

# RSS 三档阈值（GiB，默认 2.95/3.0/3.15；必须 0 < warn < stop < mainOnly）
# 自检公式：memoryBudget = min(userLimit, totalmem×0.75 − 512MiB)；
# 4GiB 云端示例：totalmem 4GiB → budget 2.5GiB → warn 2.2 / stop 2.4 / mainOnly 2.6。
# 不要超过总内存 75%（4GiB 机器即 3.0GiB）；小内存机器务必下调，否则保护可能晚于 OOM。
rssWarnGiB: 2.95
rssStopGiB: 3
rssMainOnlyGiB: 3.15

# ── 压缩/巩固耗时观测（G0-9，可选段，不参与 16 键安装自检）──────────
# 只用于「单次超阈值写一条 warn（同类去重）」与 /状态 的
# 「最近压缩耗时/最近巩固耗时」是否标注「（超阈值）」；
# 不设硬超时、不中止压缩/巩固。默认值对应真机验收口径：
# 压缩 p95 ≤ 20s、巩固 p95 ≤ 60s。
# 需要覆盖时把下面三行去掉注释并入 config.yml（正整数毫秒）：
#
# timing:
#   compactWarnMs: 20000
#   consolidateWarnMs: 60000

# ── 线程会话 preset（V10-H1，可选段，不参与 16 键安装自检）──────────
# 线程会话的宿主 agent preset（可选；不填=宿主默认，与 task_run 一致）。
# 安装时读取宿主实际 preset 列表，选「够用的最小权限」（通常 workspace-write），
# 不得选 danger-full-access。未知值运行时返回 preset_unknown。
# 需要时把下面两行去掉注释并入 config.yml：
#
# thread:
#   agentPreset: workspace-write

# ── 宿主压缩服务（compaction-basic）────────────────────────────────
# 下面不是本插件的配置键，而是 cordis.patch.yml 里 compaction-basic 的写法；
# 不要写进 config.yml。
#
# DSH web-app 默认 disabled: true，插件拿不到 compactRegion 能力，/状态 会显示
# 「压缩：宿主未开启（compaction-basic 未启用）」。云端已验证的开启写法：
#
#   - id: compaction-basic
#     disabled: false
#     config:
#       auto: false
#
# auto: false 表示宿主不每轮自动压缩，只在插件空闲边界（idleMs，默认 30 分钟）
# 由插件调用 compactRegion，避免与巩固/水位重锚抢时机。开启后 /状态 显示
# 「压缩：宿主已开启（compaction-basic 已启用）」，有待压缩区间时附数量。

