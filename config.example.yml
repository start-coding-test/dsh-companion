# dsh-companion 配置示例（16 个配置键）
#
# 用法：
#   1. 复制本文件为 config.yml（或把需要的键并入你的 profile patch）。
#   2. 首次安装先跑一次自检：
#        node scripts/calibrate/run.mjs
#      它会写出 .data/config.suggested.yml；按建议值修改 config.yml，而不是
#      直接让建议文件生效。
#   3. 内存/上下文差异较大时，以自检建议为准；下面括号里是默认值与单位。
#
# 注意：token 四档必须满足
#   0 < retainTokens < compactAtTokens < workingMemoryTokens < compactHardTokens
# 未知键只会记 warning，不会阻断启动。

# 工作记忆装配上限（token，默认 32000；建议 = min(32000, contextWindow×0.25)）
workingMemoryTokens: 32000

# 连续两轮超过该值触发巩固（token，默认 24000；建议 = round(0.75×workingMemoryTokens)）
compactAtTokens: 24000

# 安全阀：装配不得越过该值（token，默认 40000；建议 = min(1.25×working, contextWindow×0.6)）
compactHardTokens: 40000

# 距最后一条人类消息多久后允许「空闲巩固」（毫秒，默认 1800000 = 30 分钟）
idleMs: 1800000

# 压缩时保留的最近对话尾部（token，默认 6144；MVP 固定值）
retainTokens: 6144

# 线程空闲多少天后冻结（天，默认 14，>= 1）
threadIdleDays: 14

# 同时活跃的线程上限（个，默认 6，>= 1）
threadMaxActive: 6

# 每日主动消息上限（条，默认 3，>= 0；0 表示关闭主动消息）
proactiveDailyCap: 3

# 安静时段开始（HH:MM，默认 23:00，按 timezone 解释）
quietStart: "23:00"

# 安静时段结束（HH:MM，默认 08:00，按 timezone 解释）
quietEnd: "08:00"

# 墙上时间所用 IANA 时区（默认 Asia/Shanghai；影响安静时段、每日任务、
# 日界线与备份文件名，不读取进程 TZ 环境变量）
timezone: "Asia/Shanghai"

# 遗忘冷静期：标记忘掉后多少天物理删除（天，默认 7，范围 1–30）
purgeAfterDays: 7

# SQLite 数据库路径（默认 ./.data/companion.db；必须是可写目录下的非空路径）
dbPath: "./.data/companion.db"

# RSS 三档阈值（GiB，默认 2.95/3.0/3.15；必须 0 < warn < stop < mainOnly）
# 自检公式：memoryBudget = min(userLimit, totalmem×0.75 − 512MiB)；
# 4GiB 云端示例：totalmem 4GiB → budget 2.5GiB → warn 2.2 / stop 2.4 / mainOnly 2.6。
# 不要超过总内存 75%（4GiB 机器即 3.0GiB）；小内存机器务必下调，否则保护可能晚于 OOM。
rssWarnGiB: 2.95
rssStopGiB: 3
rssMainOnlyGiB: 3.15

# ── 压缩/巩固耗时观测（G0-9，可选段，不参与 16 键安装自检）──────────
# 只用于「单次超阈值写一条 warn（同类去重）」与 /状态 的
# 「最近压缩耗时/最近巩固耗时」是否标注「（超阈值）」；
# 不设硬超时、不中止压缩/巩固。默认值对应真机验收口径：
# 压缩 p95 ≤ 20s、巩固 p95 ≤ 60s。
# 需要覆盖时把下面三行去掉注释并入 config.yml（正整数毫秒）：
#
# timing:
#   compactWarnMs: 20000
#   consolidateWarnMs: 60000

# ── 线程会话 preset（V10-H1，可选段，不参与 16 键安装自检）──────────
# 线程会话的宿主 agent preset（可选；不填=宿主默认，与 task_run 一致）。
# 安装时读取宿主实际 preset 列表，选「够用的最小权限」（通常 workspace-write），
# 不得选 danger-full-access。未知值运行时返回 preset_unknown。
# 需要时把下面两行去掉注释并入 config.yml：
#
# thread:
#   agentPreset: workspace-write

# ── 人格卡（V11-P1，可选段，不参与 16 键安装自检）────────────────────
# 自定义人格卡（JSON，结构见 persona.example.md，字段与内置默认卡一致）。
# 不配置 = 内置「珞然」；只读加载一次，改卡后需重启宿主（无热加载）。
# cardPath 绝对路径原样使用；相对路径相对 DSH_HOME（$DSH_HOME trim 后非空
# 优先，否则 ~/.dsh）。例如 DSH_HOME=/opt/dsh-companion-home 时，下面这行
# 指向 /opt/dsh-companion-home/persona.json。
# 加载失败不阻断启动：回落到内置卡并写一条 warn（日志关键词
# 「persona card load failed」），/状态 显示「加载失败，已用内置：<原因>」。
# 数组字段 values/taboos/bannedPhrases 是整体替换，不是追加。
# 卡的 proactive.dailyCap/quietStart/quietEnd 本版被同名配置覆盖（不一致只
# warn，合并留 v0.4.13），主动节奏请改上面的 proactiveDailyCap/quietStart/quietEnd。
# 需要时把下面两行去掉注释并入 config.yml：
#
# persona:
#   cardPath: persona.json

# ── 巩固出区间的压缩下限（C120-M1，默认 4096 token）─────────────────
# 一次巩固产出的区间小于该值时不登记压缩（区间太小，压了也省不下上下文）。
# 0 = 关闭闸门；小于它只写一条 debug 日志，不登记 pending_compact。
# 下面这行直接可用（平铺键，不是段）：
compactMinRegionTokens: 4096

# ── 巩固写库前的近似查重与抽取上限（L120-H1/H3，可选段，
#    不参与 16 键安装自检）──────────────────────────────────────────
# dedupeSkip / dedupeAsk：草稿事实与库里同类事实的 bigram Jaccard 相似度。
#   ≥ dedupeSkip：只强化旧条（reinforce），不新增；
#   dedupeAsk..dedupeSkip：交给模型判 same / update / new；
#   < dedupeAsk：直接新增。必须 0 < dedupeAsk < dedupeSkip < 1。
# maxProjectFacts：单次巩固新增 project + knowledge 事实的上限；0 表示不写工程类事实。
# 需要覆盖时把下面四行去掉注释并入 config.yml：
#
# consolidate:
#   existingFactsLimit: 12
#   dedupeSkip: 0.85
#   dedupeAsk: 0.5
#   maxProjectFacts: 5

# ── deep-sleep 自动去重（L120-M1，可选段，不参与 16 键安装自检）─────
# 同 kind 事实两两相似度达到该值才配对，再由模型判 same/update，判中只
# supersede（不物理删）。0 = 关掉自动配对。
#
# govern:
#   autoDedupeThreshold: 0.6

# ── dormant 衰减的工程类天数（L120-H3c，可选段，不参与 16 键安装自检）──
# project / knowledge 事实多久没被召回或强化就转 dormant（0 关闭）。
#
# decay:
#   projectDormantDays: 30

# ── 提醒过期（L120-M3，平铺键）────────────────────────────────────
# 无到期时间的承诺 / 待办多久没更新就置 expired（只改状态，不物理删）。
# 到期时间已过的提醒按 24 小时宽限处理，与下面两键无关。
reminderStaleDays: 30
reminderTodoStaleDays: 7

# ── 子代理派活（SA-B1/B4，可选段，不参与 16 键安装自检）──────────────
# model：task_run / thread_run 交给宿主子代理时使用的模型；留空（默认）表示
#   沿用主会话路由，只有显式配置才经 agentOptions 传下去。取值必须在 profile
#   允许集内（magpie/opencode-go/deepseek-v4.1-flash、magpie/opencode-go/glm-5.3），
#   越界只会 warn 并回落到「沿用主会话路由」。
# concurrency：同时运行的子代理任务上限（1–8），超出排队。
#
# subagent:
#   model: ""
#   concurrency: 2

# ── 宿主压缩服务（compaction-basic）────────────────────────────────
# 下面不是本插件的配置键，而是 cordis.patch.yml 里 compaction-basic 的写法；
# 不要写进 config.yml。
#
# DSH web-app 默认 disabled: true，插件拿不到 compactRegion 能力，/状态 会显示
# 「压缩：宿主未开启（compaction-basic 未启用）」。云端已验证的开启写法：
#
#   - id: compaction-basic
#     disabled: false
#     config:
#       auto: false
#
# auto: false 表示宿主不每轮自动压缩，只在插件空闲边界（idleMs，默认 30 分钟）
# 由插件调用 compactRegion，避免与巩固/水位重锚抢时机。开启后 /状态 显示
# 「压缩：宿主已开启（compaction-basic 已启用）」，有待压缩区间时附数量。


# ── 后台长任务（W-1..W-5，可选段，不参与 16 键安装自检）────────────────
# bg_run 把超过 10 分钟的脚本（如训练）交给宿主外部的 cgroup 单元跑，插件重启
# 或宿主升级都不连带杀掉；结束后按退出码唤醒发起它的子代理（超预算则投主会话）。
# 安全边界：cwd / 脚本 realpath 必须在 workRoot 内、解释器白名单、时长与资源上限、
# bg_jobs + memory_events 审计。不审脚本内容。
#
# workRoot：留空（默认）时 bg_run 返回「不可用：未配置 bg.workRoot」。
# interpreters：只比 argv[0]；脚本按 argv 数组直传，不经 shell 拼接。
# runAs：默认空 = 与 50041 相同（当前 ubuntu uid 1000）；非 root 时走用户级 systemd，runAs 必须为空
#        （非空则 bg_run 直接不可用，插件其余功能照常加载）。
# maxDeadlineMin：deadline_min 必填且不超过它，超时 RuntimeMaxSec 终止（状态 timeout）。
# memoryMax / cpuQuota：cgroup 资源上限（默认 4G / 2 核）。
# minFreeDiskMB：workRoot 剩余空间不足就拒绝启动。
# wakeBudgetPerAgent：每个发起子代理最多被唤醒几次。
#
# bg:
#   workRoot: ""            # 建议 /opt/dsh-companion/.data/work/
#   interpreters: [python3, bash, node]
#   runAs: ""
#   maxDeadlineMin: 360
#   memoryMax: "4G"
#   cpuQuota: "200%"
#   minFreeDiskMB: 1024
#   wakeBudgetPerAgent: 3
#   # v0.7.8 W77-M2：额外从 50041 进程透传给瞬态 service 的变量名。
#   # PATH / HOME 恒透传（否则 venv、conda、代理变量与珞然的 bash 不一致）。
#   env: []
#   # v0.7.8 W77-L1：output.log 保留上限（MB，0–1024），超出只留尾部；0 关闭。
#   # v0.7.9 W78-L1：按 1MB 分块搬运，上限拉到 1024MB 也不会一次分配爆内存。
#   logMaxMB: 50
#
# 同时运行的后台任务上限（平铺键，默认 1 = 训练这类任务不并行）。
# bgConcurrency: 1